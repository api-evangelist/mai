remedy: >-
  Publish a per-store event ceiling and emit RateLimit-Limit / RateLimit-Remaining
  / RateLimit-Reset (or Retry-After on 429) from the collector, then teach the
  SDK to honor Retry-After instead of its fixed 1s/2s/3s ladder. A high-traffic
  storefront currently has no way to know it is being shed.
