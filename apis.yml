aid: mai
name: MAI
description: 'MAI is an AI performance-marketing platform that runs autonomous AI agents to create, monitor, and optimize digital advertising campaigns 24/7 on behalf of brands. Founded in December 2024 by former Google Ads and Instacart engineering leaders, MAI natively connects to a company''s advertising accounts and first-party data to deliver real-time performance analysis, attribution modeling, cross-channel budget allocation, automated campaign creation, and bid optimization. Its agents currently manage millions of dollars of Google Ads spend each month for e-commerce and consumer brands. MAI raised a $25M seed round led by Kleiner Perkins with participation from Gaorong Ventures and UpHonest Capital. MAI is delivered mainly as a managed SaaS product and as a Shopify app, and it has no general-purpose developer platform — no developer portal, API reference, OpenAPI, GraphQL or MCP server. It does publish one public, callable API: the MAI Pixel Event Collection endpoint at https://pixel.mai.co/api/collect, which ingests first-party commerce events from a merchant storefront so MAI''s agents can attribute ad spend to revenue. Its contract is published not as a specification but as first-party TypeScript declarations inside MAI''s MIT-licensed @mai-co/pixel SDK on npm.'
